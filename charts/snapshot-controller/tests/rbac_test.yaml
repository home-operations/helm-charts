suite: rbac
templates:
  - rbac.tpl
tests:
  - it: should create ClusterRole, ClusterRoleBinding, Role and RoleBinding by default
    asserts:
      - hasDocuments:
          count: 4
      - isKind:
          of: ClusterRole
        documentIndex: 0
      - isKind:
          of: ClusterRoleBinding
        documentIndex: 1
      - isKind:
          of: Role
        documentIndex: 2
      - isKind:
          of: RoleBinding
        documentIndex: 3

  - it: should include the group snapshot rules by default
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["groupsnapshot.storage.k8s.io"]
            resources: ["volumegroupsnapshotcontents"]
            verbs: ["create", "get", "list", "watch", "update", "delete", "patch"]

  - it: should drop the group snapshot rules when disabled
    set:
      controller.volumeGroupSnapshots: false
    documentIndex: 0
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["groupsnapshot.storage.k8s.io"]
            resources: ["volumegroupsnapshotcontents"]
            verbs: ["create", "get", "list", "watch", "update", "delete", "patch"]

  - it: should not create leader election resources when disabled
    set:
      controller.leaderElection.enabled: false
    asserts:
      - hasDocuments:
          count: 2

  - it: should not create any resources when rbac disabled
    set:
      rbac.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should bind the service account
    documentIndex: 1
    asserts:
      - equal:
          path: subjects[0].name
          value: RELEASE-NAME-snapshot-controller

  - it: should add annotations
    set:
      rbac.annotations:
        foo: bar
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.annotations.foo
          value: bar
