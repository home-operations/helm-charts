---
apiVersion: v2
name: snapshot-controller
description: >-
  Deploys the CSI external-snapshotter snapshot-controller together with the
  volume snapshot CRDs, shipped exactly as upstream publishes them. Snapshot
  controllers are often bundled with the Kubernetes distribution; this chart is
  for clusters where they are not.
type: application
# Floor: snapshot.storage.k8s.io/v1 CRDs + restricted Pod Security (seccompProfile).
kubeVersion: ">=1.25.0-0"
# Managed by release-please.
version: 0.1.0
# Upstream release: default image tag; must match the vendir ref (`mise run crds`).
# renovate: image=registry.k8s.io/sig-storage/snapshot-controller
appVersion: "v8.6.0"
home: https://github.com/home-operations/helm-charts
sources:
  - https://github.com/kubernetes-csi/external-snapshotter
maintainers:
  - name: home-operations
    email: contact@home-operations.com
keywords:
  - storage
  - snapshot
  - csi
annotations:
  category: Storage
