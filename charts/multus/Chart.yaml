---
apiVersion: v2
name: multus
description: >-
  Deploys the Multus CNI meta-plugin together with the
  NetworkAttachmentDefinition CRD, allowing pods to attach to additional
  networks. Includes an optional init container that installs the reference CNI
  plugins on distributions that do not ship them (e.g. Talos Linux).
type: application
kubeVersion: ">=1.25.0-0"
# Managed by release-please.
version: 0.1.0
# Upstream release: default image tag; must match the vendir ref (`mise run crds`).
# renovate: image=ghcr.io/k8snetworkplumbingwg/multus-cni
appVersion: "v4.3.0"
home: https://github.com/home-operations/helm-charts
sources:
  - https://github.com/k8snetworkplumbingwg/multus-cni
  - https://github.com/containernetworking/plugins
maintainers:
  - name: home-operations
    email: contact@home-operations.com
keywords:
  - cni
  - network
  - multus
annotations:
  category: Networking
