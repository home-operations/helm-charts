suite: serviceaccount
templates:
  - serviceaccount.tpl
tests:
  - it: should create a ServiceAccount by default
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-multus
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: should not create a ServiceAccount when disabled
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should use the provided name and annotations
    set:
      serviceAccount.name: custom-sa
      serviceAccount.annotations:
        foo: bar
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa
      - equal:
          path: metadata.annotations.foo
          value: bar
