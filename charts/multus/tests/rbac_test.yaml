suite: rbac
templates:
  - rbac.tpl
tests:
  - it: should create ClusterRole and ClusterRoleBinding by default
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ClusterRole
        documentIndex: 0
      - isKind:
          of: ClusterRoleBinding
        documentIndex: 1

  - it: should grant access to the k8s.cni.cncf.io API group
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["k8s.cni.cncf.io"]
            resources: ["*"]
            verbs: ["*"]

  - it: should bind the service account
    documentIndex: 1
    asserts:
      - equal:
          path: subjects[0].name
          value: RELEASE-NAME-multus

  - it: should not create any resources when rbac disabled
    set:
      rbac.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should add annotations
    set:
      rbac.annotations:
        foo: bar
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.annotations.foo
          value: bar
