---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  helm:
    name: Helm
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: false
          experimental: true
          install_args: --locked

      # release-please tags: <chart>-<version>, no v prefix.
      - name: Parse chart and version from the release tag
        id: parse
        run: |
          echo "chart=${TAG%-*}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG##*-}" >> "$GITHUB_OUTPUT"

      - name: Vendor upstream CRDs
        run: mise run crds

      - name: Package Helm chart
        env:
          CHART: ${{ steps.parse.outputs.chart }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: helm package "charts/${CHART}" --version "${VERSION}"

      - name: Log in to Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Helm chart to GHCR
        env:
          CHART: ${{ steps.parse.outputs.chart }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: helm push "${CHART}-${VERSION}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Sign the published chart with Cosign
        env:
          CHART: ${{ steps.parse.outputs.chart }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/charts/${CHART}:${VERSION}"
