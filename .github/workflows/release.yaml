---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  helm:
    name: Helm
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: false
          experimental: true
          install_args: --locked

      # release-please tags: <chart>-<version>, no v prefix. Match the tag
      # against the chart directories (longest name wins) so hyphenated chart
      # names and prerelease versions both parse.
      - name: Parse chart and version from the release tag
        id: parse
        run: |
          chart=""
          for dir in charts/*/; do
            name="$(basename "${dir}")"
            if [[ "${TAG}" == "${name}"-* && "${#name}" -gt "${#chart}" ]]; then
              chart="${name}"
            fi
          done
          if [[ -z "${chart}" ]]; then
            echo "::error::release tag '${TAG}' does not match any chart in charts/"
            exit 1
          fi
          echo "chart=${chart}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#"${chart}"-}" >> "$GITHUB_OUTPUT"

      # crds-check fails if the fresh vendor no longer matches the committed
      # vendir.lock.yml, so a moved upstream ref cannot ship CRDs CI never saw.
      - name: Vendor upstream CRDs
        run: mise run crds-check

      - name: Package Helm chart
        env:
          CHART: ${{ steps.parse.outputs.chart }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: helm package "charts/${CHART}" --version "${VERSION}"

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Helm chart to GHCR
        id: push
        env:
          CHART: ${{ steps.parse.outputs.chart }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          set -o pipefail
          helm push "${CHART}-${VERSION}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts" 2>&1 | tee push.log
          digest="$(awk '/^Digest:/ {print $2}' push.log)"
          if [[ -z "${digest}" ]]; then
            echo "::error::could not parse the chart digest from the helm push output"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Sign the digest, not the tag, so the signature covers exactly what was
      # pushed; cosign verify by tag still works.
      - name: Sign the published chart with Cosign
        env:
          CHART: ${{ steps.parse.outputs.chart }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/charts/${CHART}@${DIGEST}"
